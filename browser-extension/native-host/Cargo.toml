[package]
name = "long-tieng-capture-host"
version = "0.3.0"
edition = "2021"

[dependencies]
base64 = "0.22"
dirs = "6"
fs2 = "0.4"
hex = "0.4"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
csv = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
